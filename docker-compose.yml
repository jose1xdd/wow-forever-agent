services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: azeroth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5439}:5432"
    volumes:
      - azeroth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    image: azeroth-companion-mcp:local
    # On demand: `docker compose run --rm -T mcp`. Never `up -d mcp` for STDIO.
    stdin_open: true
    tty: false
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      HF_HOME: /model-cache
      WOW_EMBEDDINGS_ENABLED: ${WOW_EMBEDDINGS_ENABLED:-true}
      WOW_EMBEDDING_MODEL: ${WOW_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      WOW_MAX_DOWNLOAD_BYTES: ${WOW_MAX_DOWNLOAD_BYTES:-2097152}
      WOW_USER_AGENT: ${WOW_USER_AGENT:-AzerothCompanion/0.1 (personal research; local indexing)}
    volumes:
      - azeroth_model_cache:/model-cache

volumes:
  azeroth_pgdata:
  azeroth_model_cache:
