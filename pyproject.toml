[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azeroth-companion"
version = "0.1.0"
description = "Asistente local y persistente para World of Warcraft: Forever"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "pydantic-settings>=2.7,<3",
  "sentence-transformers>=3.4,<6",
  "transformers>=4.41,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
wow-mcp = "wow_knowledge.mcp_server:main"
wow-cli = "wow_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
